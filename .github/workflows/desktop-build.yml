name: Build & Release Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          rustup set profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install Rust (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          rustup set profile minimal
          rustup default stable

      - name: Install Tauri CLI
        working-directory: desktop-app
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build macOS (.app + universal .dmg)
        if: matrix.platform == 'macos-latest'
        working-directory: desktop-app/src-tauri
        run: cargo tauri build --target universal-apple-darwin --bundles dmg

      - name: Build Windows (.exe)
        if: matrix.platform == 'windows-latest'
        working-directory: desktop-app/src-tauri
        run: cargo tauri build --bundles nsis

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            desktop-app/src-tauri/target/*/release/bundle/dmg/*.dmg
            desktop-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: List downloaded files (diagnostics)
        run: find bundles -type f | head -20

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="nightly-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 个人工作台 ${{ steps.tag.outputs.tag }}
          body: |
            个人工作台桌面应用自动构建。

            ## 安装包
            - **macOS**：下载 `.dmg`，双击打开后把 App 拖入「应用程序」文件夹
            - **Windows**：下载 `.exe`，双击运行安装

            > 说明：由于未做付费签名，首次打开 macOS 应用如提示「无法验证开发者」，请右键选择「打开」后确认即可。
          files: |
            bundles/*.dmg
            bundles/*.exe
            bundles/**/*.dmg
            bundles/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
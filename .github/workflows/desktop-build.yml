name: Build Desktop App

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-app/**'
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          rustup set profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin

      - name: Install Rust (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          rustup set profile minimal
          rustup default stable

      - name: Install Linux/Tauri system deps (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install webkit2gtk 2>/dev/null || true

      - name: Install Tauri CLI
        working-directory: desktop-app
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build (macOS)
        if: matrix.platform == 'macos-latest'
        working-directory: desktop-app/src-tauri
        run: |
          source $HOME/.cargo/env
          cargo tauri build --target universal-apple-darwin

      - name: Build (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: desktop-app/src-tauri
        run: cargo tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app-${{ matrix.platform }}
          path: |
            desktop-app/src-tauri/target/release/bundle/dmg/*.dmg
            desktop-app/src-tauri/target/release/bundle/nsis/*.exe
            desktop-app/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn